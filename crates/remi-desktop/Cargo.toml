[package]
name = "remi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remi"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
remi-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
tray-icon = { version = "0.26.1", default-features = false }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
tracing-appender = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSDictionary"] }
objc2-user-notifications = { version = "0.3", features = ["block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotification", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
ring = "0.17"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile.workspace = true
