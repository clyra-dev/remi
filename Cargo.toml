[workspace]
members = ["crates/remi-core", "crates/remi-agent", "crates/remi-desktop", "crates/remi-package", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "time", "process", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
remi-core = { path = "crates/remi-core" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
